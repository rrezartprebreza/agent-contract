version: 1
exclude:
- legacy/**
custom:
  custom.no-lombok-data:
    title: Explicit data classes
    annotation: lombok.Data
    guidance: Do not use @Data. Use records or explicit accessors.
rules:
  spring.no-webmvctest:
    enabled: true
    approved: true
    severity: error
  spring.no-value:
    enabled: true
    approved: true
    severity: warning
  spring.no-field-injection:
    enabled: true
    approved: true
    severity: error
  python.no-mutable-defaults:
    enabled: true
    approved: false
    severity: error
  python.require-type-hints:
    enabled: true
    approved: false
    severity: error
  custom.no-lombok-data:
    enabled: true
    approved: true
    severity: warning
