# Marketplace display name. "AgentAccord" alone is blocked: an unrelated, empty GitHub
# organization owns that name, and Marketplace names must not match users or organizations.
name: AgentAccord Check
description: Check source code and AI agent instructions (skills, AGENTS.md, CLAUDE.md) against your team's approved policy.
author: Rrezart Prebreza
branding:
  icon: check-circle
  color: green

inputs:
  path:
    description: Repository path to check.
    default: "."
  base-path:
    description: "Optional separate base checkout. Uses its approved policy for both snapshots and blocks only new findings."
    default: ""
  sarif:
    description: "Upload findings to GitHub code scanning. Needs `security-events: write`."
    default: "true"
  python-version:
    description: Python used to run AgentAccord (3.12 or newer).
    default: "3.13"

outputs:
  report-path:
    description: JSON report containing all new and existing findings.
    value: ${{ steps.check.outputs.report-path }}
  exit-code:
    description: 0 no blocking findings, 1 policy violations, 2 incomplete analysis or tool failure.
    value: ${{ steps.check.outputs.exit-code }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install AgentAccord
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      # Installs the action's own tagged source, so a pinned tag runs exactly that version.
      run: python -m pip install --disable-pip-version-check --quiet "$ACTION_PATH"
    - name: Check policy
      id: check
      shell: bash
      env:
        TARGET: ${{ inputs.path }}
        BASE_TARGET: ${{ inputs.base-path }}
      # Isolated mode prevents the scanned checkout from shadowing the installed package.
      run: python -I -m agentaccord.github_action
    - name: Upload to code scanning
      if: inputs.sarif == 'true' && steps.check.outputs.sarif-path != ''
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ steps.check.outputs.sarif-path }}
        category: agentaccord
    - name: Fail on blocking findings
      shell: bash
      env:
        CODE: ${{ steps.check.outputs.exit-code }}
      run: exit "$CODE"
