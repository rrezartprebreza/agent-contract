name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install .
      - name: Unit and HTTP integration tests
        run: python -m unittest discover -s tests -v
      - name: Dogfood the CLI exit-code contract
        shell: bash
        run: |
          set +e
          agentaccord check examples/spring-demo; demo=$?
          agentaccord check examples/passing; passing=$?
          agentaccord check examples/spring-demo --format sarif > /dev/null; sarif=$?
          echo "spring-demo=$demo passing=$passing sarif=$sarif"
          test "$demo" -eq 1 && test "$passing" -eq 0 && test "$sarif" -eq 1

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Action passes on a clean repository
        uses: ./
        with:
          path: examples/passing
          sarif: "false"
      - name: Action fails on policy violations
        id: demo
        uses: ./
        continue-on-error: true
        with:
          path: examples/spring-demo
          sarif: "false"
      - name: Expect exit code 1 and a failed step
        env:
          CODE: ${{ steps.demo.outputs.exit-code }}
          OUTCOME: ${{ steps.demo.outcome }}
        run: |
          echo "exit-code=$CODE outcome=$OUTCOME"
          test "$CODE" = "1" && test "$OUTCOME" = "failure"

      - name: Prepare base and head comparison fixtures
        shell: bash
        run: |
          python - <<'PYTHON'
          from pathlib import Path
          import shutil
          base=Path('.agentaccord-ci/base')
          head=Path('.agentaccord-ci/head')
          shutil.copytree('examples/spring-demo', base)
          shutil.copytree('examples/spring-demo', head)
          PYTHON
      - name: Existing conflicts do not block the comparison
        id: comparison
        uses: ./
        with:
          path: .agentaccord-ci/head
          base-path: .agentaccord-ci/base
          sarif: "false"
      - name: Verify comparison output
        shell: bash
        env:
          REPORT: ${{ steps.comparison.outputs.report-path }}
        run: |
          python - <<'PYTHON'
          import json, os
          from pathlib import Path
          report=json.loads(Path(os.environ['REPORT']).read_text())
          assert report['comparison']['new'] == 0
          assert report['comparison']['existing'] > 0
          assert all(f['change'] == 'existing' for f in report['findings'])
          PYTHON
