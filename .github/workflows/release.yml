name: Release

# Push a tag such as v0.4.0. The tag must match agentaccord.__version__.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Tag must match the package version
        run: |
          version=$(python -c "import agentaccord; print(agentaccord.__version__)")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match agentaccord.__version__ ($version)"
            exit 1
          fi
      - name: Tests
        run: |
          python -m pip install .
          python -m unittest discover -s tests
      - name: Build and check distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/agentaccord/
    permissions:
      id-token: write  # PyPI trusted publishing: no API token is stored anywhere
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Create the GitHub release from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## \[/ { found = index($0, "[" v "]") > 0; next }
            /^\[[0-9][^]]*\]: / { found = 0 }
            found' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" dist/* --title "AgentAccord $GITHUB_REF_NAME" --notes-file notes.md
